# config.yaml — Washizukami (washi.exe) custom configuration
#
# Place this file in the same folder as washi.exe to have it loaded automatically.
# If omitted, the entire Core Set is collected.
#
# Priority: CLI flags > config.yaml > Core Set (embedded)
#
# Everything in this file is optional and commented out by default, so shipping
# it beside washi.exe does not change what is collected.
#
# ─────────────────────────────────────────────────────────────────────────────
# Section 1: Filters
# ─────────────────────────────────────────────────────────────────────────────
#
# enabled_artifacts — whitelist of artifact names to collect.
#   If empty or omitted, all artifacts are collected.
#   Matching is case-insensitive.
#
# Core Set artifact names:
#   [EventLogs]
#     - Security Event Log
#     - System Event Log
#     - Application Event Log
#   [Registry]
#     - SAM Registry Hive
#     - SECURITY Registry Hive
#     - SOFTWARE Registry Hive
#     - SYSTEM Registry Hive
#     - Amcache.hve
#     - User NTUSER.DAT
#     - User UsrClass.dat
#   [NTFS]
#     - $MFT
#     - $SECURE:$SDS
#     - $UsnJrnl:$J
#   [Filesystem]
#     - Prefetch Files
#     - Recent LNK Files
#   [WMI]
#     - WMI Repository OBJECTS.DATA
#     - WMI Repository INDEX.BTR
#     - WMI Repository MAPPING Files
#   [SRUM]
#     - SRUM Database
#   [Web]
#     - Chrome History
#     - Firefox places.sqlite
#     - Firefox cookies.sqlite
#     - IE/Edge WebCacheV01.dat
#     - Edge History

# enabled_artifacts:
#   - "Security Event Log"
#   - "System Event Log"
#   - "SAM Registry Hive"
#   - "SYSTEM Registry Hive"
#   - "SOFTWARE Registry Hive"

# disabled_categories — exclude entire categories from collection.
#   Valid values: EventLogs / Registry / NTFS / Filesystem / WMI / SRUM / Web
#   (case-insensitive), plus any category introduced by the artifacts section
#   below.
#   Evaluated after enabled_artifacts, so an artifact explicitly whitelisted will
#   still be excluded if its category is disabled.

# disabled_categories:
#   - Filesystem

# ─────────────────────────────────────────────────────────────────────────────
# Section 2: Custom artifact definitions
# ─────────────────────────────────────────────────────────────────────────────
#
# artifacts — add artifacts that are not part of the Core Set.
#   If a custom entry shares the same name as a Core one, the custom
#   definition takes priority (override).
#
# Required fields per entry:
#   name        : unique display name (referenced by enabled_artifacts)
#   category    : group name (also used as the output subfolder name)
#   target_path : path to collect. Supports %VAR% environment variables and
#                 glob wildcards (*, ?, **)
#   method      : File (standard OS copy) or NTFS (direct MFT read, bypasses
#                 file locks)

# artifacts:
#   - name: "My Application Log"
#     category: "Custom"
#     target_path: 'C:\MyApp\logs\app.log'
#     method: File
#
#   - name: "My Application DB"
#     category: "Custom"
#     target_path: 'C:\MyApp\data\app.db'
#     method: NTFS
#
#   - name: "All XML Configs"
#     category: "Custom"
#     target_path: 'C:\MyApp\config\*.xml'
#     method: File

# ─────────────────────────────────────────────────────────────────────────────
# Section 3: Ready-made Custom definitions
# ─────────────────────────────────────────────────────────────────────────────
#
# The repository ships sample definitions under artifacts/custom/. Each file is
# already shaped like this one, so you can either copy it here as config.yaml or
# merge its `artifacts:` entries into the section above.
#
#   artifacts/custom/paging.yaml          pagefile.sys / swapfile.sys / hiberfil.sys
#   artifacts/custom/browsers-extra.yaml  Brave / Vivaldi / Opera / Yandex history
#   artifacts/custom/ai-tools.yaml        Claude Code / Codex CLI local data
#   artifacts/custom/outlook.yaml         Classic Outlook .pst files
#
# See artifacts/README.md for what Core and Custom mean and why each definition
# sits where it does.
#
# Check what a definition would collect before running it for real:
#
#   washi.exe --dry-run --category Paging
