name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push to the same PR supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Test and build (x86_64-pc-windows-gnu)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The GNU toolchain is required, not merely preferred: build.rs compiles
      # the icon resource with windres and hands the resulting COFF object to
      # the linker via cargo:rustc-link-arg, which the MSVC linker will not
      # accept. This mirrors the setup in release.yml.
      - name: Install Rust toolchain (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          # This action installs with --profile minimal, which does not include
          # rustfmt. Without this line the fmt step below fails with
          # "'rustfmt' is not installed".
          components: rustfmt

      # rustfmt only parses and rewrites source text — it neither compiles nor
      # links — so it needs no target and no MinGW. Running it here, before the
      # MSYS2 install, fails a badly formatted PR in seconds instead of after
      # the whole toolchain is in place.
      - name: cargo fmt --check
        run: cargo fmt --check

      - name: Install MSYS2 / MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Add MinGW-w64 to PATH
        run: echo "C:/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: cargo test
        env:
          DLLTOOL: C:/msys64/mingw64/bin/dlltool.exe
          CARGO_TARGET_DIR: target
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: cargo test --target x86_64-pc-windows-gnu

      - name: cargo build --release
        env:
          DLLTOOL: C:/msys64/mingw64/bin/dlltool.exe
          CARGO_TARGET_DIR: target
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
        run: cargo build --release --target x86_64-pc-windows-gnu

# Still not gated. A check that is red from day one teaches people to ignore
# CI, so anything added here has to pass against main first:
#
#   cargo clippy   9 warnings against main: 4x collapsible_if,
#                  3x useless_format, 1x too_many_arguments (8/7),
#                  1x upper_case_acronyms (NTFS). Small enough to fix in one
#                  pass, after which `cargo clippy -- -D warnings` can be
#                  added as a gate — the same order fmt went through.
#
#   --locked       Would pass, now that Cargo.lock was brought back in sync
#                  with Cargo.toml in #14, but how strictly the lock should
#                  bind CI is a separate decision.
